version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════
  # 1. BROKER MQTT (Mosquitto)
  # ═══════════════════════════════════════════════════════════════════════
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: dt_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      # Mappiamo il file locale dentro il container
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - dt_network

  # ═══════════════════════════════════════════════════════════════════════
  # 2. EDGE SERVER UNIFIED (Hybrid Server)
  # ═══════════════════════════════════════════════════════════════════════
  edge-server:
    build:
      context: ./edge-server-unified
      dockerfile: Dockerfile
    container_name: dt_edge_server
    depends_on:
      - mosquitto
    environment:
      - BROKER_HOST=mosquitto
      - BROKER_PORT=1883
    ports:
      - "50051:50051" # gRPC
      - "5555:5555"   # ZeroMQ
      - "5556:5556"
    networks:
      - dt_network

  # ═══════════════════════════════════════════════════════════════════════
  # 3. ENVOY PROXY
  # ═══════════════════════════════════════════════════════════════════════
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    container_name: dt_envoy
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - edge-server
    networks:
      - dt_network

networks:
  dt_network:
    driver: bridge
